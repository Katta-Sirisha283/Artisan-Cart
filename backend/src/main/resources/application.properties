# Server
server.port=${PORT:8080}

# H2 in-memory database
spring.datasource.url=jdbc:h2:mem:boutiquedb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 console (disable in real production, handy for assessment/demo)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=false

# Load seed data on startup
spring.sql.init.mode=always

# JWT
app.jwt.secret=${JWT_SECRET:replace-this-with-a-long-random-secret-in-production}
app.jwt.expiration-ms=86400000

# Claude API (for AI features)
anthropic.api.key=${ANTHROPIC_API_KEY:}
anthropic.api.model=claude-sonnet-4-6

# CORS - allow the deployed frontend origin
app.cors.allowed-origins=${FRONTEND_ORIGIN:http://localhost:3000}
